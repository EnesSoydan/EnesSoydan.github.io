<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">GeoLens MSLS validation performance</title>
  <desc id="desc">GeoLens reaches 91.9 percent recall at one, 96.4 percent recall at five, 96.9 percent recall at ten, and 8 meter median error.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06151b"/><stop offset="1" stop-color="#102936"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#18d6a0"/><stop offset="1" stop-color="#4aa8ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1600" height="1000" rx="34" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,sans-serif">
    <text x="86" y="96" fill="#dffff7" font-size="34" font-weight="700" letter-spacing="6">MSLS VALIDATION</text>
    <text x="86" y="140" fill="#8bbab3" font-size="21" letter-spacing="2">COPENHAGEN + SAN FRANCISCO · OFFICIAL 25 M PROTOCOL</text>
    <text x="1510" y="104" text-anchor="end" fill="#55e1b7" font-size="20">743 EVALUATED QUERIES</text>
  </g>

  <g transform="translate(86 226)" font-family="Inter,Segoe UI,sans-serif" filter="url(#shadow)">
    <rect width="1030" height="650" rx="30" fill="#0c2027" stroke="#9effe4" stroke-opacity=".17"/>
    <text x="54" y="74" fill="#e3fff8" font-size="25" font-weight="700">Recall comparison</text>
    <text x="958" y="74" text-anchor="end" fill="#83b9af" font-size="17">GeoLens vs. classic NetVLAD baseline</text>

    <g transform="translate(170 124)">
      <path d="M0 0V420M0 420H760" stroke="#9dd7cd" stroke-opacity=".25" stroke-width="2"/>
      <g fill="#769f99" font-size="16">
        <text x="-30" y="426" text-anchor="end">0%</text><text x="-30" y="321" text-anchor="end">25%</text>
        <text x="-30" y="216" text-anchor="end">50%</text><text x="-30" y="111" text-anchor="end">75%</text><text x="-30" y="6" text-anchor="end">100%</text>
      </g>
      <g stroke="#9dd7cd" stroke-opacity=".1"><path d="M0 315H760"/><path d="M0 210H760"/><path d="M0 105H760"/><path d="M0 0H760"/></g>

      <g transform="translate(70 0)">
        <rect x="0" y="34" width="92" height="386" rx="14" fill="url(#bar)"/>
        <rect x="104" y="73" width="92" height="347" rx="14" fill="#416b75"/>
        <text x="46" y="22" text-anchor="middle" fill="#dffff7" font-size="22" font-weight="700">91.9%</text>
        <text x="150" y="61" text-anchor="middle" fill="#9db9bd" font-size="20">82.6%</text>
        <text x="98" y="466" text-anchor="middle" fill="#d8fff5" font-size="22" font-weight="700">R@1</text>
      </g>
      <g transform="translate(315 0)">
        <rect x="0" y="15" width="92" height="405" rx="14" fill="url(#bar)"/>
        <rect x="104" y="44" width="92" height="376" rx="14" fill="#416b75"/>
        <text x="46" y="3" text-anchor="middle" fill="#dffff7" font-size="22" font-weight="700">96.4%</text>
        <text x="150" y="32" text-anchor="middle" fill="#9db9bd" font-size="20">89.6%</text>
        <text x="98" y="466" text-anchor="middle" fill="#d8fff5" font-size="22" font-weight="700">R@5</text>
      </g>
      <g transform="translate(560 0)">
        <rect x="0" y="13" width="92" height="407" rx="14" fill="url(#bar)"/>
        <rect x="104" y="34" width="92" height="386" rx="14" fill="#416b75"/>
        <text x="46" y="1" text-anchor="middle" fill="#dffff7" font-size="22" font-weight="700">96.9%</text>
        <text x="150" y="22" text-anchor="middle" fill="#9db9bd" font-size="20">92.0%</text>
        <text x="98" y="466" text-anchor="middle" fill="#d8fff5" font-size="22" font-weight="700">R@10</text>
      </g>
    </g>

    <g transform="translate(54 594)" font-size="18">
      <rect width="20" height="20" rx="5" fill="#22d6a3"/><text x="32" y="17" fill="#b7dcd5">GeoLens · DINOv2 + SALAD</text>
      <rect x="318" width="20" height="20" rx="5" fill="#416b75"/><text x="350" y="17" fill="#8daeb1">NetVLAD · literature baseline</text>
    </g>
  </g>

  <g transform="translate(1160 226)" font-family="Inter,Segoe UI,sans-serif">
    <rect width="354" height="310" rx="30" fill="#0c2027" stroke="#9effe4" stroke-opacity=".17"/>
    <text x="32" y="62" fill="#8bbab3" font-size="18" letter-spacing="2">MEDIAN GEO ERROR</text>
    <text x="32" y="180" fill="#e9fff9" font-size="112" font-weight="800">8</text>
    <text x="178" y="180" fill="#58dfb7" font-size="42" font-weight="700">METERS</text>
    <path d="M34 235h286" stroke="#61dbb7" stroke-opacity=".25"/>
    <text x="32" y="276" fill="#a8d0c8" font-size="18">Top-1 coordinate prediction</text>

    <rect y="350" width="354" height="300" rx="30" fill="#0c2027" stroke="#9effe4" stroke-opacity=".17"/>
    <text x="32" y="412" fill="#8bbab3" font-size="18" letter-spacing="2">MODEL STACK</text>
    <g fill="#e6fff8" font-size="22" font-weight="700">
      <text x="32" y="468">DINOv2 ViT-B/14</text><text x="32" y="518">SALAD aggregation</text>
      <text x="32" y="568">FAISS IndexFlatIP</text><text x="32" y="618">Eigen-CAM XAI</text>
    </g>
  </g>

  <text x="86" y="944" fill="#6f9f97" font-family="Inter,Segoe UI,sans-serif" font-size="18">RETRIEVAL-FIRST · EXPLAINABLE · LICENSE-GATED MSLS DATASET</text>
</svg>
